name: gradeastra
description: Smart CGPA Calculator for Indian University Students
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_mobile_ads: ^5.1.0
  fl_chart: ^0.68.0
  share_plus: ^10.0.0
  screenshot: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  path_provider: ^2.1.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
