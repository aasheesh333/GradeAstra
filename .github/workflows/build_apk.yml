name: Build GradeAstra

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          else
            echo "No KEYSTORE_BASE64 found, creating a demo keystore"
            keytool -genkey -v \
              -keystore android/app/upload-keystore.jks \
              -alias "${KEY_ALIAS:-mykey}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass changeit \
              -keypass changeit \
              -dname "CN=GradeAstra, OU=Development, O=GradeAstra, L=Delhi, S=Delhi, C=IN"
          fi

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$STORE_PASSWORD" ]; then
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-mykey}" >> android/key.properties
            echo "storeFile=../app/upload-keystore.jks" >> android/key.properties
          else
            echo "storePassword=changeit" > android/key.properties
            echo "keyPassword=changeit" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-mykey}" >> android/key.properties
            echo "storeFile=../app/upload-keystore.jks" >> android/key.properties
          fi

      - name: Run Flutter Tests
        run: flutter test
        continue-on-error: true

      - name: Build Split Release APKs
        env:
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
          VERSION_CODE: ${{ secrets.VERSION_CODE }}
          VERSION_NAME: ${{ secrets.VERSION_NAME }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=ADMOB_BANNER_ID="${ADMOB_BANNER_ID:-}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${ADMOB_INTERSTITIAL_ID:-}" \
            --dart-define=ADMOB_REWARDED_ID="${ADMOB_REWARDED_ID:-}" \
            --dart-define=ADMOB_APP_ID="${ADMOB_APP_ID:-}" \
            --dart-define=PACKAGE_NAME="${PACKAGE_NAME:-}" \
            --dart-define=VERSION_CODE="${VERSION_CODE:-}" \
            --dart-define=VERSION_NAME="${VERSION_NAME:-}" \
            --build-name="${VERSION_NAME:-1.0.0}" \
            --build-number="${VERSION_CODE:-1}"

      - name: Build Universal Release APK
        env:
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
          VERSION_CODE: ${{ secrets.VERSION_CODE }}
          VERSION_NAME: ${{ secrets.VERSION_NAME }}
        run: |
          flutter build apk --release \
            --dart-define=ADMOB_BANNER_ID="${ADMOB_BANNER_ID:-}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${ADMOB_INTERSTITIAL_ID:-}" \
            --dart-define=ADMOB_REWARDED_ID="${ADMOB_REWARDED_ID:-}" \
            --dart-define=ADMOB_APP_ID="${ADMOB_APP_ID:-}" \
            --dart-define=PACKAGE_NAME="${PACKAGE_NAME:-}" \
            --dart-define=VERSION_CODE="${VERSION_CODE:-}" \
            --dart-define=VERSION_NAME="${VERSION_NAME:-}" \
            --build-name="${VERSION_NAME:-1.0.0}" \
            --build-number="${VERSION_CODE:-1}"

      - name: Build Release AAB (Play Store)
        env:
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
          VERSION_CODE: ${{ secrets.VERSION_CODE }}
          VERSION_NAME: ${{ secrets.VERSION_NAME }}
        run: |
          flutter build appbundle --release \
            --dart-define=ADMOB_BANNER_ID="${ADMOB_BANNER_ID:-}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${ADMOB_INTERSTITIAL_ID:-}" \
            --dart-define=ADMOB_REWARDED_ID="${ADMOB_REWARDED_ID:-}" \
            --dart-define=ADMOB_APP_ID="${ADMOB_APP_ID:-}" \
            --dart-define=PACKAGE_NAME="${PACKAGE_NAME:-}" \
            --dart-define=VERSION_CODE="${VERSION_CODE:-}" \
            --dart-define=VERSION_NAME="${VERSION_NAME:-}" \
            --build-name="${VERSION_NAME:-1.0.0}" \
            --build-number="${VERSION_CODE:-1}"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GradeAstra-Release-APKs
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: GradeAstra-Universal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: GradeAstra-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
