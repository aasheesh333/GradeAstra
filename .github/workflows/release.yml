name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      version_code:
        description: 'Version code (integer, e.g. 2)'
        required: true
        default: '2'
      track:
        description: 'Play Store track (internal/alpha/beta/production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME#v}"
            echo "version_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            # Falls back to the workflow secret/default if not overridden
            echo "version_code=${{ secrets.VERSION_CODE || github.event.inputs.version_code || '2' }}" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=${{ github.event.inputs.version_name }}" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ github.event.inputs.version_code }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          else
            echo "No KEYSTORE_BASE64 secret found; creating demo keystore"
            keytool -genkey -v \
              -keystore android/app/upload-keystore.jks \
              -alias "${KEY_ALIAS:-mykey}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass changeit \
              -keypass changeit \
              -dname "CN=CGPA Calculator, OU=Development, O=CGPA Calculator, L=Delhi, S=Delhi, C=IN"
          fi

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$STORE_PASSWORD" ]; then
            echo "storePassword=$STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-mykey}" >> android/key.properties
            echo "storeFile=../app/upload-keystore.jks" >> android/key.properties
          else
            echo "storePassword=changeit" > android/key.properties
            echo "keyPassword=changeit" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-mykey}" >> android/key.properties
            echo "storeFile=../app/upload-keystore.jks" >> android/key.properties
          fi

      - name: Build release AAB
        env:
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.version_code || secrets.VERSION_CODE || '2' }}
          VERSION_NAME: ${{ steps.version.outputs.version_name || secrets.VERSION_NAME || '1.1.0' }}
        run: |
          flutter build appbundle --release \
            --dart-define=ADMOB_BANNER_ID="${ADMOB_BANNER_ID:-}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${ADMOB_INTERSTITIAL_ID:-}" \
            --dart-define=ADMOB_REWARDED_ID="${ADMOB_REWARDED_ID:-}" \
            --dart-define=ADMOB_APP_ID="${ADMOB_APP_ID:-}" \
            --dart-define=PACKAGE_NAME="${PACKAGE_NAME:-}" \
            --dart-define=VERSION_CODE="${VERSION_CODE:-}" \
            --dart-define=VERSION_NAME="${VERSION_NAME:-}" \
            --build-name="${VERSION_NAME:-1.1.0}" \
            --build-number="${VERSION_CODE:-2}"

      - name: Build release APK
        env:
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
          VERSION_CODE: ${{ steps.version.outputs.version_code || secrets.VERSION_CODE || '2' }}
          VERSION_NAME: ${{ steps.version.outputs.version_name || secrets.VERSION_NAME || '1.1.0' }}
        run: |
          flutter build apk --release \
            --dart-define=ADMOB_BANNER_ID="${ADMOB_BANNER_ID:-}" \
            --dart-define=ADMOB_INTERSTITIAL_ID="${ADMOB_INTERSTITIAL_ID:-}" \
            --dart-define=ADMOB_REWARDED_ID="${ADMOB_REWARDED_ID:-}" \
            --dart-define=ADMOB_APP_ID="${ADMOB_APP_ID:-}" \
            --dart-define=PACKAGE_NAME="${PACKAGE_NAME:-}" \
            --dart-define=VERSION_CODE="${VERSION_CODE:-}" \
            --dart-define=VERSION_NAME="${VERSION_NAME:-}" \
            --build-name="${VERSION_NAME:-1.1.0}" \
            --build-number="${VERSION_CODE:-2}"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
